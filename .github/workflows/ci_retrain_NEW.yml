name: CI/CD ML Pipeline

on:
  schedule:
    # Run every week on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      retrain_model:
        description: 'Retrain model'
        required: false
        default: true
        type: boolean

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12.7"

    - name: Install MLflow
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0

    - name: Copy processed data
      run: |
        mkdir -p MLProject/data_preprocessed
        cp -r Eksperimen_SML_Randi-Sumitro/preprocessing/data_preprocessed/* MLProject/data_preprocessed/ || echo "Data preprocessing not found, will download fresh data"

    - name: Run MLflow project
      run: |
        cd MLProject
        mlflow run . --experiment-name "Titanic-CI-Pipeline"
      env:
        MLFLOW_TRACKING_URI: https://dagshub.com/randisumitro/MLflow-Randi-Sumitro.mlflow
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

    - name: Build Docker image
      run: |
        cd MLProject
        # Get the latest run ID
        RUN_ID=$(mlflow runs list -e "Titanic-CI-Pipeline" --max-results 1 --output-format json | python -c "import sys, json; print(json.load(sys.stdin)[0]['run']['info']['run_id'])" 2>/dev/null || echo "latest")

        # Build Docker image with the model
        if [ "$RUN_ID" != "latest" ]; then
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "titanic-model:latest"
        else
          echo "Using latest model"
          mlflow models build-docker -m "model" -n "titanic-model:latest" || echo "Model not found, skipping Docker build"
        fi
      env:
        MLFLOW_TRACKING_URI: https://dagshub.com/randisumitro/MLflow-Randi-Sumitro.mlflow
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: randisumitro
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Push to Docker Hub
      run: |
        if docker images | grep "titanic-model"; then
          docker tag titanic-model:latest randisumitro/titanic-model:latest
          docker push randisumitro/titanic-model:latest
          echo "Docker image pushed successfully"
        else
          echo "Docker image not found, skipping push"
        fi

    - name: Update deployment info
      run: |
        echo "Deployment completed on $(date)" > deployment_info.txt
        echo "Docker image: randisumitro/titanic-model:latest" >> deployment_info.txt
        echo "MLflow tracking: https://dagshub.com/randisumitro/MLflow-Randi-Sumitro.mlflow" >> deployment_info.txt
